name: agrocloud-team

# Para equipos nuevos: construye la API desde el codigo del repositorio.
# En la computadora original se sigue usando docker-compose.yml.
services:
  db:
    image: postgres:16
    container_name: agrocloud-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: agrocloud-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrocloud-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Define POSTGRES_DB en .env}
      DB_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8443}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: agrocloud-team-postgres-data
