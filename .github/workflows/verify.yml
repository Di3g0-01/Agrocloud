name: Verify

on:
  push:
    branches: [backend-lead, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrocloud_test
          POSTGRES_USER: agrocloud
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrocloud -d agrocloud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RUN_DB_INTEGRATION_TESTS: 'true'
      DB_URL: jdbc:postgresql://localhost:5432/agrocloud_test
      DB_USERNAME: agrocloud
      DB_PASSWORD: test_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
