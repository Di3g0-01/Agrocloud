name: agrocloud-e04

services:
  db:
    image: postgres:16
    container_name: agrocloud-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - agrocloud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    # Mail credentials are used only by the backend, never by the web build.
    image: agrocloud-backend:e04
    build:
      context: ./backend
    container_name: agrocloud-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Define POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM: ${MAIL_FROM:-AgroCloud <no-reply@agrocloud.local>}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-host.docker.internal}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-false}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - agrocloud
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: agrocloud-web:e04
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: agrocloud-web
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - agrocloud
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: agrocloud-postgres-data

networks:
  agrocloud:
    external: true
    name: agrocloud-net
