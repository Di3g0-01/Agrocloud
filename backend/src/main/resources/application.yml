spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: agrocloud-backend
  web:
    error:
      include-message: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/agrocloud_db}
    username: ${DB_USERNAME:agrocloud_user}
    password: ${DB_PASSWORD:agrocloud_secure_pass_2026}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    repair: true
    validate-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  # SMTP is optional (production can use the HTTPS provider).
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:AgroCloud <no-reply@agrocloud.local>}
    provider: ${MAIL_PROVIDER:smtp}
    brevo-api-key: ${BREVO_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVNlY3JldEtleUZvckFncm9DbG91ZEpXVEF1dGhlbnRpY2F0aW9uT25seTIwMjY=}
    expiration: ${JWT_EXPIRATION:PT8H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443,https://*.vercel.app}
  public-db:
    host: ${PUBLIC_DB_HOST:ep-cool-bonus-b4dogngv.c-6.us-east-2.aws.neon.tech}
    port: ${PUBLIC_DB_PORT:5432}
    database: ${PUBLIC_DB_NAME:neondb}
    user: ${PUBLIC_DB_USER:neondb_owner}
    password: ${PUBLIC_DB_PASSWORD:npg_gnKk6U7mePhX}
