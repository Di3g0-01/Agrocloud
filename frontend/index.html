          <p>
            AgroCloud es la solución de Base de Datos como Servicio (DBaaS) diseñada para productores, fincas, cooperativas y agroempresas en Guatemala.
          </p>

          <ul>
            <li>Instancias PostgreSQL 16 aisladas por esquema multi-tenant.</li>
