<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Isotipo Verde para Fondos Claros (Nube verde oscura, Cilindro verde oscuro con base verde lima y Hoja verde) -->
  <!-- Nube en la parte superior trasera -->
  <path 
    d="M 33 60 
       C 22 60 17 52 19 43 
       C 21 34 29 31 35 32 
       C 37 19 50 11 63 13 
       C 74 15 81 24 80 34 
       C 87 36 93 41 91 50 
       C 90 58 83 61 74 61" 
    fill="none" 
    stroke="#092817" 
    stroke-width="5.2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Discos de Base de Datos (cilindro) -->
  <!-- Nivel superior del cilindro -->
  <path 
    d="M 33 52 C 33 46 67 46 67 52 C 67 58 33 58 33 52 Z" 
    fill="none" 
    stroke="#092817" 
    stroke-width="4.8" 
  />

  <!-- Segundo anillo / capa -->
  <path 
    d="M 33 54 V 62 C 33 68 67 68 67 62 V 54" 
    fill="none" 
    stroke="#092817" 
    stroke-width="4.8" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Tercer anillo / capa -->
  <path 
    d="M 33 65 V 73 C 33 79 67 79 67 73 V 65" 
    fill="none" 
    stroke="#092817" 
    stroke-width="4.8" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Base inferior verde lima destacada -->
  <path 
    d="M 33 76 V 84 C 33 90 67 90 67 84 V 76" 
    fill="none" 
    stroke="#65a30d" 
    stroke-width="5.2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Tallo y Hoja germinando desde el centro del disco -->
  <path 
    d="M 50 63 
       V 44 
       C 50 31 63 28 65 38 
       C 67 48 54 53 50 63 Z" 
    fill="#65a30d" 
  />
  <!-- Nervadura de la hoja -->
  <path 
    d="M 50 49 C 54 44 59 40 62 39" 
    fill="none" 
    stroke="#092817" 
    stroke-width="2" 
    stroke-linecap="round"
  />
</svg>
